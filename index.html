

<!DOCTYPE html>
<html>
<head>
    <title>My Main Page</title>
    <style>
        body {
            background-color: red;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
        }
        h1 {
            color: white;
            padding: 15px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            width: 100%;
            gap: 5px;
            padding: 5px;
            box-sizing: border-box;
        }
        .column {
            min-width: 0;
            min-height: 500px;
            padding: 10px;
            box-sizing: border-box;
            overflow-wrap: anywhere;
        }
        .column1 {
            background-color: #B5D76A;
        }
        .column2 {
            background-color: #83D9D9;
        }
        .column3 {
            background-color: #D9A6DC;
        }
        iframe {
            max-width: 100%;
        }
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Main Page Title</h1>
    <div class="container">
        <!-- FIRST COLUMN -->
        <div class="column column1">
            <h2>Title 1</h2>
            <!-- PASTE FIRST WEATHER WIDGET CODE HERE -->
        </div>
        <!-- SECOND COLUMN -->
        <div class="column column2">
            <h2>Title 2</h2>
            <!-- PASTE YOUR IMAGE OR SECOND WIDGET HERE -->
        </div>
        <!-- THIRD COLUMN -->
        <div class="column column3">
            <h2>Title 3</h2>
            <!-- PASTE THIRD WEATHER WIDGET CODE HERE -->
        </div>
    </div>
</body>
</html>
